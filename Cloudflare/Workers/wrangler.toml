name = "ai-advertising-robot"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../../Website"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
TIMEZONE = "Asia/Kolkata"
DEFAULT_GROK_MODEL = "grok-2-1212"
ADMIN_EMAIL = "nttf.ttc.m3b.group1.project@gmail.com"

# Cron Triggers for Automatic Server-Side Advertisement Evaluation
[triggers]
crons = ["* * * * *"]

